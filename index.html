    if(!camInit){Object.assign(cv,tv);camInit=true;}else for(const a in cv)cv[a]+=(tv[a]-cv[a])*kc;
    if(orbitHome&&!paused){orbit.az+=(0-orbit.az)*kc;orbit.el+=(0-orbit.el)*kc;}
    const th=Math.tan(cam.fov*Math.PI/360),dist=1.1*Math.max(cv.hh/th,cv.hw/(th*cam.aspect));
    const az=cv.az+orbit.az,el=Math.max(.05,Math.min(1.45,cv.el+orbit.el));
    cam.position.set(cv.tx+dist*Math.sin(az)*Math.cos(el),cv.ty+dist*Math.sin(el),cv.tz+dist*Math.cos(az)*Math.cos(el));
    cam.lookAt(cv.tx,cv.ty,cv.tz);
    // lights and shadows follow the focus
    const ext=Math.max(cv.hw,cv.hh);
    focus.position.set(cv.tx,cv.ty+5+ext*.5,cv.tz+2.5+ext*.25);focus.distance=18+ext*2.6;
    key.target.position.set(cv.tx,cv.ty,cv.tz);key.position.set(cv.tx+16,cv.ty+34,cv.tz+12);
    const half=Math.max(14,Math.min(48,ext*1.5));
    if(Math.abs(half-shHalf)>.5){shHalf=half;const sc=key.shadow.camera;sc.left=-half;sc.right=half;sc.top=half;sc.bottom=-half;sc.updateProjectionMatrix();}
    renderer.render(scene,cam);
  }
  requestAnimationFrame(frame);

  /* pointer: drag orbits, tap picks */
  const ray=new T.Raycaster(),ndc=new T.Vector2();
  function pick(ev){const r=canvas.getBoundingClientRect();ndc.set(((ev.clientX-r.left)/r.width)*2-1,-((ev.clientY-r.top)/r.height)*2+1);ray.setFromCamera(ndc,cam);
    const h=ray.intersectObjects(hits,false);for(let i=0;i<h.length;i++){const id=h[i].object.userData.id;
      if((id==='ledger'&&cur.ledger<.5)||(id==='rival'&&cur.rivalOn<.5)||(id==='stair'&&cur.stairOn<.5))continue;return id;}return null;}
  let down=null;
  canvas.addEventListener('pointerdown',ev=>{down={x:ev.clientX,y:ev.clientY,az:orbit.az,el:orbit.el,moved:false};try{canvas.setPointerCapture(ev.pointerId);}catch(e){}$('hint').style.opacity='0';});
  canvas.addEventListener('pointermove',ev=>{
    if(!down){if(ev.pointerType==='mouse')canvas.style.cursor=pick(ev)?'pointer':'grab';return;}
    const dx=ev.clientX-down.x,dy=ev.clientY-down.y;if(Math.abs(dx)+Math.abs(dy)>7)down.moved=true;
    if(down.moved){orbitHome=false;orbit.az=Math.max(-1.1,Math.min(1.1,down.az-dx*.006));orbit.el=Math.max(-.4,Math.min(.5,down.el+dy*.004));}});
  canvas.addEventListener('pointerup',ev=>{const d=down;down=null;if(!d||d.moved)return;const id=pick(ev);if(!id)return;
    if(!inspect&&S[idx].hot===id){next();return;}look(id);});
  canvas.addEventListener('pointercancel',()=>{down=null;});

  return{snap};
}

function start(data){
  if(data&&typeof data.i==='number'){idx=Math.max(0,Math.min(S.length-1,data.i));setCur(S[idx]);}
  if(renderer){try{world=build();}catch(e){world=null;fail();if(window.console)console.error(e);}}else fail();
  render();
  try{if(!localStorage.getItem('pa001-help-seen')){localStorage.setItem('pa001-help-seen','1');$('help').hidden=false;}}catch(e){}
}
const hot=window.claude&&window.claude.hot;
if(hot&&hot.snapshot)hot.snapshot(()=>({i:idx}));
if(hot&&hot.ready)hot.ready(start);else start((hot&&hot.data)||{});
})();
<\/script>

</body></html>
</script>

<script>
'use strict';

/* =======================================================================
   PRAXIS SITE — WHAT TO EDIT

   1. LINKS    Channel links. Leave a link empty and its button stays hidden.
   2. VIDEOS   The library. One entry per video. To publish one, set
               status: 'published', the date, and (when you have it) the url.
   3. PAGES    The site's pages. The order here is the order in the nav.

   ADDING A PAGE
   A page written for this site:
       { id: 'about', label: 'About', title: 'About', render: () => `<div class="wrap">…</div>` }
   A self-contained HTML piece (a tool, a simulator):
       paste it into a new text/plain block with id="embed-NAME"
       above, then add
       { id: 'NAME', label: 'Name', title: 'Name', embed: 'embed-NAME' }
   Either way the page gets a nav link, a footer link and the address #/id.
   Add  soon: true  to show a "Soon" tag beside the nav link.
   ======================================================================= */

const LINKS = {
  youtube: '',      // e.g. 'https://www.youtube.com/@yourchannel'
};

const VIDEOS = [
  {
    id: 's002',
    code: 'S002',
    title: 'Why can someone with a high income still be broke?',
    format: 'short',
    status: 'published',
    date: '2026-10-03',
    url: '',
    poster: { fig: '$0', line: 'left at month end', cols: 10, groups: [[['g', 20]], [['w', 20]]] },
    summary: 'You get a big promotion. You make more, so you spend more: the nicer car, the bigger place, the better restaurants. None of it looks like a problem on its own, because you can afford it. But if your spending rises every time your income does, you end up right back where you started.',
    takeaway: 'If you spend everything you make, it doesn’t matter how high your income is. You can still end the month with nothing left.',
  },
  {
    id: 's001',
    code: 'S001',
    title: 'Why is 8% interest high?',
    format: 'short',
    status: 'published',
    date: '2026-10-02',
    url: '',
    poster: { fig: '8%', line: 'became 25% more', cols: 10, groups: [[['b', 8]], [['g', 25]]] },
    summary: 'You borrow $100,000 at 8% to open your business. For the first year you only pay the interest, about $667 a month. A year in, you check your balance and you still owe $100,000. Then the real payments start: about $2,441 a month for four years, each one finally chipping away at the debt.',
    takeaway: '8% interest made you pay back 25% more than you borrowed.',
    numbers: [
      ['Borrowed', '$100,000'],
      ['Interest rate', '8% a year'],
      ['Year 1, interest only', 'about $667 a month'],
      ['Years 2 to 5', 'about $2,441 a month'],
      ['Interest paid', 'about $25,182'],
      ['Paid back in total', 'about $125,182'],
    ],
    tool: { page: 'calculator', label: 'Run your own loan' },
  },
  {
    id: 's003',
    code: 'S003',
    title: 'Why a lower mortgage payment can cost more in the long run',
    format: 'short',
    status: 'upcoming',
    stage: 'In production',
    date: '',
    url: '',
    poster: { fig: '30', line: 'years instead of 20', cols: 10, groups: [[['o', 30]]] },
    // Shown once status is 'published'.
    summary: 'Your broker recommends 30 years instead of 20. Borrowing $300,000 at 5%, that drops the payment from about $1,971 a month to $1,601, which frees up $370 every month. But you pay the debt down more slowly, and the bank collects interest for longer.',
    takeaway: 'Saving $370 a month cost about $103,000 more in interest.',
    numbers: [
      ['Borrowed', '$300,000'],
      ['Interest rate', '5%'],
      ['Payment over 20 years', 'about $1,971 a month'],
      ['Payment over 30 years', 'about $1,601 a month'],
      ['Monthly difference', 'about $370'],
      ['Extra interest over 30 years', 'about $103,000'],
    ],
    fine: 'Canadian dollars. 5% a year compounded twice a year, the same rate at every renewal, regular monthly payments, and no extra payments or fees.',
    source: { label: 'Financial Consumer Agency of Canada: mortgage relief options', url: 'https://www.canada.ca/en/financial-consumer-agency/services/mortgages/relief-options.html' },
    tool: { page: 'calculator', label: 'Run your own mortgage' },
  },
];

const FORMATS = { short: 'Short', long: 'Long-form' };

/* What the calculator page contains (names and descriptions match the tool). */
const CALCULATORS = [
  ['Loan', 'What a fixed-rate loan costs you, payment by payment.'],
  ['Mortgage', 'Your payment, what you still owe when the term ends, and the interest along the way.'],
  ['Savings', 'How regular deposits grow, and how much of the total is interest.'],
  ['Debt payoff', 'How long a fixed payment takes to clear a balance, and what paying extra saves.'],
  ['Compare rates', 'The same loan at two interest rates, side by side.'],
];

const PAGES = [
  { id: 'home', title: '', render: renderHome },
  { id: 'library', label: 'Library', title: 'Library', render: renderLibrary },
  {
    id: 'calculator', label: 'Calculator', title: 'Calculator',
    embed: 'embed-calculator',
    // The site bar already carries the brand, so the tool's own wordmark is hidden.
    embedCss: '.brand{display:none!important}',
    standaloneUrl: 'https://calculator.oakridgepartners.ca',
  },
  {
    // PA001, the first paced animation. To add another, paste it in as a new
    // embed block and add an entry like this one.
    id: 'interactive', label: 'Interactive', title: 'Why is everything so expensive?',
    embed: 'embed-pa001',
  },
];

/* =======================================================================
   Helpers
   ======================================================================= */
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const $ = (sel, root = document) => root.querySelector(sel);

/* The Praxis coin: a P with a straight stem and a rounded bowl inside two rings. */
const EMBLEM = '<svg viewBox="-1 -1 2 2" aria-hidden="true"><circle r="1" fill="#D4AF37"/><circle r=".865" fill="none" stroke="#000" stroke-opacity=".38" stroke-width=".035"/><circle r=".785" fill="none" stroke="#000" stroke-opacity=".28" stroke-width=".02"/><path fill="#000" fill-rule="evenodd" d="M-.48 .61H-.245V.165H.095A.375 .38 0 0 0 .095-.595H-.48ZM-.245-.378H.135V-.055H-.245Z"/></svg>';

function formatDate(iso) {
  const [y, m, d] = iso.split('-').map(Number);
  return new Date(y, m - 1, d).toLocaleDateString('en-CA', { year: 'numeric', month: 'long', day: 'numeric' });
}

function blocks(spec) {
  return spec.map(([kind, n]) => Array.from({ length: n }, () => `<i class="blk ${kind}"></i>`).join('')).join('');
}

function poster(v) {
  const p = v.poster;
  const cls = ['poster', v.format === 'long' ? 'wide' : '', v.status === 'upcoming' ? 'pending' : ''].join(' ').trim();
  return `<div class="${cls}" aria-hidden="true"><div class="poster-in">
    <div><div class="fig">${esc(p.fig)}</div><div class="line">${esc(p.line)}</div></div>
    <div class="blockset">${p.groups.map((g) => `<div class="blocks" style="--cols:${p.cols}">${blocks(g)}</div>`).join('')}</div>
  </div></div>`;
}

function card(v) {
  const live = v.status === 'published';
  const right = live ? formatDate(v.date) : v.stage;
  const inner = `${poster(v)}
    <div><h3>${esc(v.title)}</h3>
    <div class="meta"><span>${FORMATS[v.format]}</span><span>${esc(right)}</span></div></div>`;
  const cls = 'card' + (v.format === 'long' ? ' wide' : '');
  return live
    ? `<a class="${cls}" href="#/library/${v.id}">${inner}</a>`
    : `<div class="${cls}">${inner}</div>`;
}

const published = () => VIDEOS.filter((v) => v.status === 'published').sort((a, b) => b.date.localeCompare(a.date));
const upcoming = () => VIDEOS.filter((v) => v.status === 'upcoming');

/* =======================================================================
   Pages
   ======================================================================= */
function renderHome() {
  const out = published();
  const next = upcoming().filter((v) => v.format === 'short').slice(0, 1);
  const interest = Array.from({ length: 25 }, (_, i) => `<i class="blk g" style="--i:${i}"></i>`).join('');
  return `
  <div class="wrap">
    <section class="hero">
      <div>
        <h1>Start with<br>a question.</h1>
        <p class="lede">Follow where it leads. Praxis makes short, visual explanations of how money actually works, and free tools to run the numbers yourself.</p>
        <div class="actions">
          <a class="btn primary" href="#/library">Browse the library</a>
          <a class="btn" href="#/calculator">Open the calculator</a>
        </div>
      </div>
      <a class="stage" href="#/library/s001" aria-label="Why is 8% interest high? Borrow $100,000 at 8%, pay back about $125,182. Open the video page.">
        <p class="q">Why is 8% interest high?</p>
        <div class="stack" aria-hidden="true">
          <div class="interest">${interest}</div>
          <div class="borrowed">${blocks([['b', 100]])}</div>
        </div>
        <div class="legend" aria-hidden="true">
          <div><i class="dot b"></i>Borrowed<b>$100,000</b></div>
          <div><i class="dot g"></i>Interest<b>$25,182</b></div>
        </div>
        <p class="cap" aria-hidden="true">Interest only for a year, then paid off over four. Each block is $1,000.</p>
      </a>
    </section>

    <section class="section">
      <div class="section-head">
        <h2>Latest videos</h2>
        <a class="text-link" href="#/library">See all videos</a>
      </div>
      <div class="shelf">${[...out, ...next].map(card).join('')}</div>
    </section>

    <section class="section">
      <div class="split">
        <div>
          <h2>Then run your own numbers</h2>
          <p class="lede">The calculator shows where every payment goes: what pays down the amount you borrowed, and what goes to interest.</p>
          <div class="actions"><a class="btn primary" href="#/calculator">Open the calculator</a></div>
        </div>
        <ul class="calc-list">${CALCULATORS.map(([n, d]) => `<li><b>${esc(n)}</b><span>${esc(d)}</span></li>`).join('')}</ul>
      </div>
    </section>

    <section class="section">
      <div class="split">
        <div>
          <h2>Why is everything so expensive?</h2>
          <p class="lede">A higher price is an outcome, not an explanation. This one isn’t a video. It’s a model you move through at your own speed: a loaf of bread, the chain that makes it, and what happens to the price when something changes.</p>
          <div class="actions"><a class="btn primary" href="#/interactive">Start the interactive piece</a></div>
        </div>
      </div>
    </section>
  </div>`;
}

const libraryState = { filter: 'all' };

function renderLibrary(rest) {
  if (rest[0]) return renderVideo(rest[0]);
  const f = libraryState.filter;
  const match = (v) => f === 'all' || v.format === f;
  const out = published().filter(match);
  const next = upcoming().filter(match);
  const used = Object.keys(FORMATS).filter((k) => VIDEOS.some((v) => v.format === k));
  const chips = [['all', 'All'], ...used.map((k) => [k, k === 'short' ? 'Shorts' : FORMATS[k]])]
    .map(([k, label]) => `<button type="button" data-filter="${k}" aria-pressed="${k === f}">${label}</button>`).join('');
  return `
  <div class="wrap">
    <header class="page-head">
      <h1>Library</h1>
      <p class="lede">Every Praxis video, newest first. Each one starts with a single question.</p>
      ${used.length > 1 ? `<div class="filters" role="group" aria-label="Show">${chips}</div>` : ''}
    </header>
    <section class="group">
      <h2>Out now</h2>
      ${out.length ? `<div class="shelf">${out.map(card).join('')}</div>` : `<p class="empty">Nothing published in this format yet. The first one is listed under “Coming up”.</p>`}
    </section>
    ${next.length ? `<section class="group"><h2>Coming up</h2><div class="shelf">${next.map(card).join('')}</div></section>` : ''}
  </div>`;
}

function renderVideo(id) {
  const v = VIDEOS.find((x) => x.id === id && x.status === 'published');
  if (!v) return renderMissing();
  const watch = v.url ? `<a class="btn primary" href="${esc(v.url)}" target="_blank" rel="noopener">Watch the video</a>` : '';
  const tool = v.tool ? `<a class="btn${watch ? '' : ' primary'}" href="#/${v.tool.page}">${esc(v.tool.label)}</a>` : '';
  return `
  <div class="wrap">
    <a class="back" href="#/library"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>Library</a>
    <article class="video">
      ${poster(v)}
      <div>
        <h1>${esc(v.title)}</h1>
        <p class="when">${FORMATS[v.format]}, published ${formatDate(v.date)}</p>
        <p class="summary">${esc(v.summary)}</p>
        ${v.takeaway ? `<p class="takeaway">${esc(v.takeaway)}</p>` : ''}
        ${watch || tool ? `<div class="actions">${watch}${tool}</div>` : ''}
        ${v.numbers ? `<dl class="numbers">${v.numbers.map(([k, val]) => `<div><dt>${esc(k)}</dt><dd>${esc(val)}</dd></div>`).join('')}</dl>` : ''}
        ${v.fine ? `<p class="fine">${esc(v.fine)}</p>` : ''}
        ${v.source ? `<p class="fine">Source: <a href="${esc(v.source.url)}" target="_blank" rel="noopener">${esc(v.source.label)}</a></p>` : ''}
      </div>
    </article>
  </div>`;
}

function renderMissing() {
  return `
  <div class="wrap">
    <header class="page-head">
      <h1>Page not found</h1>
      <p class="lede">There’s nothing at this address. It may have moved, or the link may be mistyped.</p>
      <div class="actions" style="margin-top:28px"><a class="btn primary" href="#/">Go to the home page</a><a class="btn" href="#/library">Browse the library</a></div>
    </header>
  </div>`;
}

/* =======================================================================
   Embedded pages
   ======================================================================= */
const embedHosts = {};

function mountEmbed(page) {
  let host = embedHosts[page.id];
  if (host) return host;
  host = document.createElement('div');
  host.className = 'embed';
  $('#embeds').appendChild(host);
  embedHosts[page.id] = host;

  const fail = () => {
    host.innerHTML = `<div class="fallback wrap">
      <h1>This page couldn’t load here.</h1>
      <p class="lede">${page.standaloneUrl ? 'It still works on its own page.' : 'Reload the page to try again.'}</p>
      ${page.standaloneUrl ? `<a class="btn primary" href="${esc(page.standaloneUrl)}" target="_blank" rel="noopener">Open it on its own page</a>` : ''}
    </div>`;
  };

  const source = document.getElementById(page.embed);
  if (!source) { fail(); return host; }
  const LT = '<';
  let doc = source.textContent.replace(/<\\\/script/gi, LT + '/script').replace(/<\\!--/g, LT + '!--');
  const ready = LT + 'script>try{parent.postMessage({praxisEmbed:"' + page.id + '"},"*")}catch(e){}' + LT + '/script>';
  doc = doc.replace(LT + '/head>', '<style>' + (page.embedCss || '') + '</style>' + ready + LT + '/head>');

  const frame = document.createElement('iframe');
  frame.title = page.title;
  host.appendChild(frame);
  host.dataset.ready = '';
  frame.srcdoc = doc;
  setTimeout(() => { if (host.dataset.ready !== 'yes') fail(); }, 5000);
  return host;
}

window.addEventListener('message', (e) => {
  const id = e.data && e.data.praxisEmbed;
  if (id && embedHosts[id]) embedHosts[id].dataset.ready = 'yes';
});

/* =======================================================================
   Router
   ======================================================================= */
const state = { path: '' };

function readHash() {
  try { return decodeURIComponent((location.hash || '').replace(/^#\/?/, '')).replace(/\/+$/, ''); } catch (e) { return ''; }
}

function navigate(path, push = true) {
  state.path = path;
  if (push) {
    try { history.pushState(null, '', '#/' + path); } catch (e) { /* address bar unavailable: the page still changes */ }
  }
  render(true);
}

function render(moved) {
  const [first = '', ...rest] = state.path.split('/');
  const id = first || 'home';
  const page = PAGES.find((p) => p.id === id) || { id: '', title: 'Page not found', render: renderMissing };
  const view = $('#view');
  const isEmbed = Boolean(page.embed);

  document.documentElement.classList.toggle('embed-mode', isEmbed);
  view.hidden = isEmbed;
  $('#foot').hidden = isEmbed;
  $('#embeds').hidden = !isEmbed;
  for (const host of Object.values(embedHosts)) host.hidden = true;

  if (isEmbed) mountEmbed(page).hidden = false;
  else view.innerHTML = page.render(rest);

  for (const a of document.querySelectorAll('#site-nav a')) {
    if (a.dataset.page === page.id) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
  }
  const video = id === 'library' && VIDEOS.find((v) => v.id === rest[0] && v.status === 'published');
  const title = video ? video.title : page.title;
  document.title = title ? title + ' | Praxis by Oakridge' : 'Praxis by Oakridge';
  if (moved) {
    window.scrollTo(0, 0);
    if (!isEmbed) view.focus({ preventScroll: true });
  }
}

document.addEventListener('click', (e) => {
  const filter = e.target.closest('[data-filter]');
  if (filter) { libraryState.filter = filter.dataset.filter; render(false); return; }
  const a = e.target.closest('a[href^="#/"]');
  if (!a || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || e.button !== 0) return;
  e.preventDefault();
  navigate(a.getAttribute('href').replace(/^#\/?/, '').replace(/\/+$/, ''));
});
const onAddressChange = () => { const p = readHash(); if (p !== state.path) navigate(p, false); };
window.addEventListener('popstate', onAddressChange);
window.addEventListener('hashchange', onAddressChange);

/* =======================================================================
   Start
   ======================================================================= */
for (const el of document.querySelectorAll('[data-brand]')) {
  el.innerHTML = EMBLEM + '<b>Praxis</b><span>by Oakridge</span>';
  el.setAttribute('aria-label', 'Praxis by Oakridge, home');
}
const navPages = PAGES.filter((p) => p.label);
$('#site-nav').innerHTML = navPages
  .map((p) => `<a href="#/${p.id}" data-page="${p.id}">${esc(p.label)}${p.soon ? '<span class="tag">Soon</span>' : ''}</a>`).join('');
$('#foot-nav').innerHTML = navPages.map((p) => `<a href="#/${p.id}">${esc(p.label)}</a>`).join('')
  + (LINKS.youtube ? `<a href="${esc(LINKS.youtube)}" target="_blank" rel="noopener">YouTube</a>` : '');

state.path = readHash();
render(false);
</script>
</body>
