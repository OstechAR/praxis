<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Praxis by Oakridge</title>
<meta name="description" content="Short, visual explanations of how money works, with free tools to run the numbers yourself.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Praxis by Oakridge.
   Palette: Artstyle & Visual Production Standard, section 3.
   Black is the stage in every viewer theme, so the tokens do not change
   between light and dark. Gold = money and value. Blue = information and
   systems. White = neutral text and structure. */
:root,
:root[data-theme="dark"],
:root[data-theme="light"] {
  --black: #000000;
  --surface: #12161D;
  --hairline: #232A36;
  --white: #F5F7FA;
  --muted: #9AA3B2;
  --gold: #D4AF37;
  --blue: #3B82F6;
  --page: 1160px;
  --gutter: 20px;
  color-scheme: dark;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --black: #000000; --white: #F5F7FA; }
}
:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
*, *::before, *::after { box-sizing: inherit; }
html { min-height: 100%; scroll-padding-top: calc(env(safe-area-inset-top, 0px) + 72px); }
body {
  margin: 0;
  min-height: 100%;
  display: flex;
  flex-direction: column;
  background: var(--black);
  color: var(--white);
  font-family: 'Geist', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
  font-size: 16px;
  line-height: 1.5;
  font-variant-numeric: tabular-nums;
  -webkit-font-smoothing: antialiased;
  -webkit-text-size-adjust: 100%;
}
h1, h2, h3, p, dl, dd, figure, ul { margin: 0; padding: 0; }
ul { list-style: none; }
a { color: inherit; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; border-radius: 4px; }
[hidden] { display: none !important; }
.muted { color: var(--muted); }
.wrap { width: 100%; max-width: var(--page); margin: 0 auto; padding: 0 var(--gutter); }

/* ---------- Site bar ---------- */
.bar {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 20;
  background: var(--black);
  border-bottom: 1px solid var(--hairline);
}
.bar-inner { display: flex; align-items: center; gap: 16px; height: 56px; }
.brand { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; flex: none; }
.brand svg { width: 28px; height: 28px; flex: none; }
.brand b { font-size: 17px; font-weight: 600; letter-spacing: -0.01em; }
.brand span { display: none; font-size: 14px; color: var(--muted); }
.site-nav {
  margin-left: auto;
  display: flex; gap: 2px;
  overflow-x: auto; scrollbar-width: none;
  margin-right: calc(var(--gutter) * -1); padding-right: var(--gutter);
}
.site-nav::-webkit-scrollbar { display: none; }
.site-nav a {
  flex: none;
  display: inline-flex; align-items: center; gap: 8px;
  height: 44px; padding: 0 9px;
  font-size: 14px; font-weight: 500; color: var(--muted);
  text-decoration: none; white-space: nowrap;
}
.site-nav a:hover { color: var(--white); }
.site-nav a[aria-current="page"] { color: var(--white); box-shadow: inset 0 -2px 0 var(--gold); }
.tag {
  display: inline-block; padding: 1px 7px;
  border: 1px solid var(--hairline); border-radius: 999px;
  font-size: 12px; line-height: 18px; font-weight: 500; color: var(--muted);
}
.site-nav .tag { display: none; }

/* ---------- Page frame ---------- */
#view { flex: 1 0 auto; }
#view:focus { outline: none; }
.section { padding: 56px 0; border-top: 1px solid var(--hairline); }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin-bottom: 24px; }
h2 { font-size: 26px; line-height: 1.2; font-weight: 600; letter-spacing: -0.02em; }
.lede { font-size: 18px; line-height: 1.5; color: var(--muted); max-width: 46ch; }
.text-link { font-weight: 500; white-space: nowrap; text-underline-offset: 4px; text-decoration-color: var(--hairline); }
.text-link:hover { text-decoration-color: var(--white); }

.btn {
  display: inline-flex; align-items: center; justify-content: center;
  height: 48px; padding: 0 22px;
  border: 1px solid var(--hairline); border-radius: 24px;
  background: transparent; color: var(--white);
  font-size: 16px; font-weight: 500; text-decoration: none; cursor: pointer;
}
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--white); border-color: var(--white); color: var(--black); font-weight: 600; }
.btn.primary:hover { background: #DDE2EA; border-color: #DDE2EA; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; }

/* ---------- Blocks: the Praxis unit of money ---------- */
.blk {
  display: block; aspect-ratio: 1 / 1; border-radius: 22%;
  box-shadow: inset 0 2px 0 rgba(255,255,255,.35), inset 0 -2px 0 rgba(0,0,0,.25);
}
.blk.b { background: var(--blue); }
.blk.g { background: var(--gold); }
.blk.w { background: var(--white); box-shadow: inset 0 -2px 0 rgba(0,0,0,.2); }
.blk.o { background: transparent; box-shadow: inset 0 0 0 1px var(--hairline); }
.dot { display: inline-block; width: 10px; height: 10px; border-radius: 2px; flex: none; }
.dot.b { background: var(--blue); }
.dot.g { background: var(--gold); }

/* ---------- Home: hero ---------- */
.hero { padding: 40px 0 56px; display: grid; gap: 44px; }
.hero h1 {
  font-size: clamp(52px, 15vw, 112px);
  line-height: 0.94; font-weight: 600; letter-spacing: -0.045em;
}
.hero .lede { margin-top: 24px; }
.hero .actions { margin-top: 28px; }
.stage { display: block; max-width: 300px; text-decoration: none; }
.stage .q { font-size: 20px; line-height: 1.25; font-weight: 600; letter-spacing: -0.01em; }
.stack { margin-top: 18px; display: grid; gap: 3px; }
.stack .interest { display: flex; flex-wrap: wrap-reverse; gap: 3px; }
.stack .interest .blk { width: calc((100% - 27px) / 10); }
.stack .borrowed { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 3px; }
.stage .legend { margin-top: 16px; display: grid; gap: 6px; font-size: 14px; line-height: 20px; }
.stage .legend div { display: flex; align-items: center; gap: 10px; }
.stage .legend b { margin-left: auto; font-weight: 600; }
.stage .cap { margin-top: 14px; font-size: 14px; line-height: 20px; color: var(--muted); }
.stage:hover .q { text-decoration: underline; text-underline-offset: 4px; }
/* The one orchestrated moment: interest stacks up on top of what was borrowed. */
@keyframes stack-in { from { opacity: 0; transform: translateY(-8px) scale(.6); } to { opacity: 1; transform: none; } }
.stack .interest .blk { animation: stack-in .3s cubic-bezier(.2,.8,.3,1) both; animation-delay: calc(450ms + var(--i, 0) * 36ms); }
@media (prefers-reduced-motion: reduce) { .stack .interest .blk { animation: none; } }

/* ---------- Video cards and posters ---------- */
.shelf { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 28px 14px; }
.card { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; align-content: start; text-decoration: none; }
.card h3 { font-size: 16px; line-height: 1.3; font-weight: 600; letter-spacing: -0.005em; }
a.card:hover h3 { text-decoration: underline; text-underline-offset: 3px; }
.card .meta { display: flex; justify-content: space-between; gap: 10px; margin-top: 4px; font-size: 13px; line-height: 18px; color: var(--muted); }
.card.wide { grid-column: 1 / -1; }
.poster {
  container-type: inline-size;
  position: relative; overflow: hidden;
  aspect-ratio: 9 / 16;
  border: 1px solid var(--hairline); border-radius: 14px;
  background: var(--black);
}
.poster-in { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: space-between; padding: 9cqw; }
.poster.wide { aspect-ratio: 16 / 9; }
.poster.wide .poster-in { padding: 5cqw; }
.poster .fig { font-size: 30cqw; line-height: .9; font-weight: 600; letter-spacing: -0.05em; }
.poster.wide .fig { font-size: 13cqw; }
.poster .line { margin-top: 5cqw; font-size: 8cqw; line-height: 1.2; font-weight: 500; color: var(--muted); max-width: 12ch; }
.poster.wide .line { margin-top: 2cqw; font-size: 4cqw; max-width: 24ch; }
.poster .blockset { display: grid; gap: 4cqw; }
.poster.wide .blockset { width: 46%; gap: 2cqw; }
.poster .blocks { display: grid; grid-template-columns: repeat(var(--cols, 10), minmax(0, 1fr)); gap: 1.4cqw; }
.poster.wide .blocks { gap: .7cqw; }
.poster .blocks .blk { box-shadow: inset 0 1px 0 rgba(255,255,255,.35), inset 0 -1px 0 rgba(0,0,0,.25); }
.poster .blocks .blk.o { box-shadow: inset 0 0 0 1px var(--hairline); }
.poster.pending .fig { color: var(--muted); }

/* ---------- Home: tools and interactive ---------- */
.split { display: grid; gap: 40px; }
.calc-list { border-top: 1px solid var(--hairline); }
.calc-list li { display: grid; gap: 2px; padding: 14px 0; border-bottom: 1px solid var(--hairline); }
.calc-list b { font-weight: 600; }
.calc-list span { font-size: 15px; color: var(--muted); }
.split .lede { margin-top: 12px; }
.split .actions { margin-top: 24px; }

/* ---------- Library ---------- */
.page-head { padding: 40px 0 32px; }
.page-head h1 { font-size: clamp(40px, 10vw, 64px); line-height: 1; font-weight: 600; letter-spacing: -0.035em; }
.page-head .lede { margin-top: 14px; }
.filters { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 24px; }
.filters button {
  height: 44px; padding: 0 16px;
  border: 1px solid var(--hairline); border-radius: 22px;
  background: transparent; color: var(--muted);
  font-size: 15px; font-weight: 500; cursor: pointer;
}
.filters button[aria-pressed="true"] { background: var(--white); border-color: var(--white); color: var(--black); font-weight: 600; }
.group { padding: 0 0 56px; }
.group h2 { margin-bottom: 20px; font-size: 20px; }
.empty { padding: 28px 0; color: var(--muted); }

/* ---------- Video page ---------- */
.back { display: inline-flex; align-items: center; gap: 6px; height: 44px; margin-top: 16px; font-size: 15px; font-weight: 500; color: var(--muted); text-decoration: none; }
.back:hover { color: var(--white); }
.video { display: grid; gap: 32px; padding: 8px 0 64px; }
.video .poster { max-width: 170px; }
.video h1 { font-size: clamp(32px, 7vw, 52px); line-height: 1.04; font-weight: 600; letter-spacing: -0.03em; max-width: 16ch; }
.video .when { margin-top: 12px; font-size: 15px; color: var(--muted); }
.video .summary { margin-top: 24px; font-size: 18px; line-height: 1.55; max-width: 56ch; }
.video .takeaway { margin-top: 20px; padding-left: 16px; border-left: 2px solid var(--gold); font-size: 18px; line-height: 1.45; font-weight: 500; max-width: 44ch; }
.video .actions { margin-top: 28px; }
.numbers { margin-top: 36px; max-width: 520px; border-top: 1px solid var(--hairline); }
.numbers div { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; padding: 12px 0; border-bottom: 1px solid var(--hairline); }
.numbers dt { color: var(--muted); font-size: 15px; }
.numbers dd { font-weight: 600; text-align: right; }
.fine { margin-top: 16px; font-size: 13px; line-height: 19px; color: var(--muted); max-width: 60ch; }

/* ---------- Coming-soon page ---------- */
.soon { padding: 48px 0 72px; display: grid; gap: 40px; }
.soon h1 { font-size: clamp(44px, 12vw, 88px); line-height: .96; font-weight: 600; letter-spacing: -0.04em; max-width: 9ch; }
.soon .lede { margin-top: 20px; }
.soon .actions { margin-top: 28px; }
.year { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; max-width: 420px; }
.year div { display: grid; gap: 6px; font-size: 12px; line-height: 16px; color: var(--muted); text-align: center; }

/* ---------- Embedded pages (calculator, future interactive pieces) ---------- */
html.embed-mode, html.embed-mode body { height: 100%; }
html.embed-mode body { overflow: hidden; }
#embeds { flex: 1 1 auto; min-height: 0; display: flex; }
.embed { flex: 1 1 auto; min-height: 0; position: relative; display: flex; }
.embed iframe { flex: 1 1 auto; width: 100%; height: 100%; border: 0; background: var(--black); }
.embed .fallback {
  position: absolute; inset: 0; background: var(--black);
  display: grid; align-content: center; justify-items: start; gap: 16px;
  padding: 24px var(--gutter);
}
.embed .fallback h1 { font-size: 26px; line-height: 1.2; font-weight: 600; letter-spacing: -0.02em; }

/* ---------- Footer ---------- */
.foot { border-top: 1px solid var(--hairline); padding: 32px 0 40px; font-size: 14px; line-height: 21px; color: var(--muted); }
.foot-inner { display: grid; gap: 20px; }
.foot .brand b { font-size: 15px; color: var(--white); }
.foot .brand span { display: inline; }
.foot nav { display: flex; flex-wrap: wrap; gap: 4px 20px; }
.foot nav a { display: inline-flex; align-items: center; min-height: 32px; text-decoration: none; }
.foot nav a:hover { color: var(--white); }
.foot p { max-width: 58ch; }

/* ---------- Wider screens ---------- */
@media (min-width: 560px) {
  :root { --gutter: 28px; }
  .brand span { display: inline; }
  .site-nav a { padding: 0 12px; font-size: 15px; }
  .site-nav .tag { display: inline-block; }
  .shelf { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 32px 18px; }
}
@media (min-width: 900px) {
  :root { --gutter: 40px; }
  .bar-inner { height: 64px; }
  .hero { grid-template-columns: minmax(0, 1fr) 340px; align-items: end; gap: 64px; padding: 72px 0 88px; }
  .section { padding: 72px 0; }
  .shelf { grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 36px 20px; }
  .card.wide { grid-column: span 2; }
  .split { grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); gap: 72px; align-items: start; }
  .page-head { padding: 64px 0 40px; }
  .video { grid-template-columns: 260px minmax(0, 1fr); gap: 56px; padding-top: 24px; }
  .video .poster { max-width: none; }
  .stage { max-width: 340px; }
  .soon { grid-template-columns: minmax(0, 1fr) 420px; align-items: end; gap: 64px; padding: 88px 0 104px; }
  .foot-inner { grid-template-columns: auto 1fr; align-items: start; gap: 16px 56px; }
  .foot p { grid-column: 1 / -1; }
}
</style>
</head>

<style>

.blk { aspect-ratio: 1 / 1; border-radius: 22%; box-shadow: inset 0 2px 0 rgba(255,255,255,.35), inset 0 -2px 0 rgba(0,0,0,.25); }

<script>
/* Oakridge calculation engine (JavaScript port of the Dart engine).
   Money is whole cents in a Number. Rates are exact fractions (BigInt).
   Interest is rounded half up to the cent every period. */
const CalcEngine = (() => {
  'use strict';

  const Compounding = { annually: 1, semiAnnually: 2, quarterly: 4, monthly: 12, daily: 365 };

  const Frequency = {
    monthly: { perYear: 12, label: 'Monthly', noun: 'month' },
    semiMonthly: { perYear: 24, label: 'Twice a month', noun: 'payment' },
    biWeekly: { perYear: 26, label: 'Every 2 weeks', noun: 'payment' },
    acceleratedBiWeekly: { perYear: 26, monthlyDivisor: 2, label: 'Every 2 weeks, accelerated', noun: 'payment' },
    weekly: { perYear: 52, label: 'Weekly', noun: 'payment' },
    acceleratedWeekly: { perYear: 52, monthlyDivisor: 4, label: 'Weekly, accelerated', noun: 'payment' },
  };

  class PaymentTooSmallError extends Error {
    constructor(paymentCents, interestCents) {
      super('Payment does not cover the interest');
      this.name = 'PaymentTooSmallError';
      this.paymentCents = paymentCents;
      this.interestCents = interestCents;
      this.minimumPaymentCents = interestCents + 1;
    }
  }

  function fail(message) { throw new RangeError(message); }

  /** "100000", "1,234.5", "$2,441.29" -> cents. Throws on anything else. */
  function parseCents(text) {
    const cleaned = String(text).trim().replace(/[,$\s]/g, '');
    if (!/^\d+(\.\d{1,2})?$/.test(cleaned)) throw new SyntaxError('Not a valid amount');
    const [dollars, cents = ''] = cleaned.split('.');
    return Number(dollars) * 100 + Number(cents.padEnd(2, '0') || 0);
  }

  function roundHalfUp(numerator, denominator) {
    return Number((numerator * 2n + denominator) / (denominator * 2n));
  }

  /** A nominal annual rate held as an exact fraction: "8" is exactly 8/100. */
  function annualRate(percentText) {
    const cleaned = String(percentText).trim().replace('%', '').trim();
    if (!/^\d+(\.\d+)?$/.test(cleaned)) throw new SyntaxError('Not a valid rate');
    const [whole, decimals = ''] = cleaned.split('.');
    const numerator = BigInt(whole + decimals);
    const denominator = 100n * 10n ** BigInt(decimals.length);
    return { numerator, denominator, fraction: Number(numerator) / Number(denominator) };
  }

  /** The rate for one payment period. Exact when compounding matches the
      payment frequency; otherwise the equivalent rate in floating point. */
  function periodicRate(rate, periodsPerYear, compoundsPerYear) {
    if (periodsPerYear === compoundsPerYear || rate.numerator === 0n) {
      const numerator = rate.numerator;
      const denominator = rate.denominator * BigInt(periodsPerYear);
      return {
        value: Number(numerator) / Number(denominator),
        interestOn: (balanceCents) => roundHalfUp(BigInt(balanceCents) * numerator, denominator),
      };
    }
    const value = Math.pow(1 + rate.fraction / compoundsPerYear, compoundsPerYear / periodsPerYear) - 1;
    return { value, interestOn: (balanceCents) => Math.round(balanceCents * value) };
  }

  function levelPaymentCents(principalCents, rate, periods) {
    if (rate.value === 0) return roundHalfUp(BigInt(principalCents), BigInt(periods));
    return Math.round(principalCents * rate.value / (1 - Math.pow(1 + rate.value, -periods)));
  }

  function makeSchedule(rows, periodsPerYear) {
    const last = rows[rows.length - 1];
    return {
      rows,
      periodsPerYear,
      periods: rows.length,
      totalInterestCents: last ? last.cumulativeInterestCents : 0,
      totalPaidCents: rows.reduce((sum, r) => sum + r.paymentCents, 0),
      closingCents: last ? last.closingCents : 0,
      byYear() {
        const years = [];
        for (let start = 0; start < rows.length; start += periodsPerYear) {
          const slice = rows.slice(start, start + periodsPerYear);
          const end = slice[slice.length - 1];
          years.push({
            period: years.length + 1,
            openingCents: slice[0].openingCents,
            interestCents: slice.reduce((s, r) => s + r.interestCents, 0),
            paymentCents: slice.reduce((s, r) => s + r.paymentCents, 0),
            principalCents: slice.reduce((s, r) => s + r.principalCents, 0),
            closingCents: end.closingCents,
            cumulativeInterestCents: end.cumulativeInterestCents,
            firstRow: start,
            rowCount: slice.length,
          });
        }
        return years;
      },
    };
  }

  /** Period-by-period breakdown of a debt. The last scheduled payment (or the
      last payment needed) clears whatever is still owing. */
  function amortize({ principalCents, rate, paymentCents, periodsPerYear, interestOnlyPeriods = 0, scheduledPeriods = null, maxPeriods = 12000 }) {
    if (!(principalCents > 0)) fail('principal must be > 0');
    if (!(paymentCents > 0)) fail('payment must be > 0');
    const lastScheduled = scheduledPeriods == null ? null : interestOnlyPeriods + scheduledPeriods;
    const rows = [];
    let balance = principalCents;
    let cumulative = 0;
    while (balance > 0) {
      const period = rows.length + 1;
      if (period > maxPeriods) fail('debt not repaid within ' + maxPeriods + ' periods');
      const interest = rate.interestOn(balance);
      const owing = balance + interest;
      let payment;
      if (period <= interestOnlyPeriods) payment = interest;
      else if (period === lastScheduled || paymentCents >= owing) payment = owing;
      else if (paymentCents <= interest) throw new PaymentTooSmallError(paymentCents, interest);
      else payment = paymentCents;
      cumulative += interest;
      rows.push({
        period,
        openingCents: balance,
        interestCents: interest,
        paymentCents: payment,
        principalCents: payment - interest,
        closingCents: owing - payment,
        cumulativeInterestCents: cumulative,
      });
      balance = owing - payment;
    }
    return makeSchedule(rows, periodsPerYear);
  }

  function calculateLoan({ principalCents, rate, termPeriods, paymentsPerYear = 12, compoundsPerYear = 12, interestOnlyPeriods = 0, extraPaymentCents = 0 }) {
    if (!(termPeriods > 0)) fail('term must be > 0');
    if (interestOnlyPeriods < 0 || interestOnlyPeriods >= termPeriods) fail('interest-only period must be shorter than the term');
    if (!(principalCents > 0)) fail('principal must be > 0');
    const periodic = periodicRate(rate, paymentsPerYear, compoundsPerYear);
    const amortizing = termPeriods - interestOnlyPeriods;
    const paymentCents = levelPaymentCents(principalCents, periodic, amortizing);
    const schedule = amortize({
      principalCents, rate: periodic, paymentCents: paymentCents + extraPaymentCents,
      periodsPerYear: paymentsPerYear, interestOnlyPeriods, scheduledPeriods: amortizing,
    });
    return {
      principalCents,
      paymentCents,
      interestOnlyPaymentCents: interestOnlyPeriods > 0 ? periodic.interestOn(principalCents) : null,
      schedule,
      totalInterestCents: schedule.totalInterestCents,
      totalPaidCents: schedule.totalPaidCents,
      interestShare: schedule.totalInterestCents / principalCents,
    };
  }

  function calculateMortgage({ priceCents, downPaymentCents, rate, amortizationYears, compoundsPerYear, termYears = null, frequency = 'monthly' }) {
    if (downPaymentCents < 0 || downPaymentCents >= priceCents) fail('down payment must be less than the price');
    if (!(amortizationYears > 0)) fail('amortization must be > 0');
    if (termYears != null && (termYears <= 0 || termYears > amortizationYears)) fail('term must be no longer than the amortization');
    const freq = Frequency[frequency] || fail('unknown frequency');
    const principalCents = priceCents - downPaymentCents;
    const periodic = periodicRate(rate, freq.perYear, compoundsPerYear);
    const scheduledPeriods = amortizationYears * freq.perYear;
    let paymentCents;
    if (freq.monthlyDivisor) {
      const monthly = levelPaymentCents(principalCents, periodicRate(rate, 12, compoundsPerYear), amortizationYears * 12);
      paymentCents = roundHalfUp(BigInt(monthly), BigInt(freq.monthlyDivisor));
    } else {
      paymentCents = levelPaymentCents(principalCents, periodic, scheduledPeriods);
    }
    const schedule = amortize({ principalCents, rate: periodic, paymentCents, periodsPerYear: freq.perYear, scheduledPeriods });
    const termPeriods = termYears == null ? null : termYears * freq.perYear;
    const termEnd = termPeriods == null ? null : schedule.rows[Math.min(termPeriods, schedule.periods) - 1];
    return {
      principalCents,
      paymentCents,
      schedule,
      termPeriods,
      payoffPeriods: schedule.periods,
      totalInterestCents: schedule.totalInterestCents,
      totalPaidCents: schedule.totalPaidCents,
      interestShare: schedule.totalInterestCents / principalCents,
      balanceAtTermEndCents: termEnd ? termEnd.closingCents : null,
      interestOverTermCents: termEnd ? termEnd.cumulativeInterestCents : null,
      principalOverTermCents: termEnd ? principalCents - termEnd.closingCents : null,
    };
  }

  function calculateSavings({ initialCents, contributionCents, rate, years, contributionsPerYear = 12, compoundsPerYear = 12, contributeAtStart = false }) {
    if (initialCents < 0 || contributionCents < 0) fail('amounts must be >= 0');
    if (!(years > 0)) fail('years must be > 0');
    const periodic = periodicRate(rate, contributionsPerYear, compoundsPerYear);
    const rows = [];
    let balance = initialCents;
    let cumulative = 0;
    const periods = years * contributionsPerYear;
    for (let period = 1; period <= periods; period++) {
      const interest = periodic.interestOn(contributeAtStart ? balance + contributionCents : balance);
      const closing = balance + contributionCents + interest;
      cumulative += interest;
      rows.push({
        period, openingCents: balance, interestCents: interest, paymentCents: contributionCents,
        principalCents: contributionCents, closingCents: closing, cumulativeInterestCents: cumulative,
      });
      balance = closing;
    }
    const schedule = makeSchedule(rows, contributionsPerYear);
    return {
      initialCents,
      schedule,
      finalBalanceCents: balance,
      totalContributedCents: initialCents + schedule.totalPaidCents,
      totalInterestCents: schedule.totalInterestCents,
    };
  }

  function calculateDebtPayoff({ balanceCents, rate, paymentCents, paymentsPerYear = 12, compoundsPerYear = 12, extraPaymentCents = 0 }) {
    const schedule = amortize({
      principalCents: balanceCents,
      rate: periodicRate(rate, paymentsPerYear, compoundsPerYear),
      paymentCents: paymentCents + extraPaymentCents,
      periodsPerYear: paymentsPerYear,
    });
    return {
      principalCents: balanceCents,
      schedule,
      periods: schedule.periods,
      totalInterestCents: schedule.totalInterestCents,
      totalPaidCents: schedule.totalPaidCents,
      interestShare: schedule.totalInterestCents / balanceCents,
    };
  }

  return {
    Compounding, Frequency, PaymentTooSmallError,
    parseCents, annualRate, periodicRate, levelPaymentCents, amortize,
    calculateLoan, calculateMortgage, calculateSavings, calculateDebtPayoff,
  };
})();

      for (let i = 0; i < count; i++) cells += '<i class="blk ' + kind + '" style="--i:' + i + '"></i>';
    }
    return '<div class="blocks' + (chunky ? ' chunky' : '') + '" style="--cols:' + cols + '" role="img" aria-label="' + esc(label) + '">' + cells + '</div>';
  }

  // One gold block per 1% of the amount borrowed, capped so very long loans
  // do not fill the screen.
  const interestBlocks = (share, interestCents) => (interestCents === 0 ? 0 : Math.min(400, Math.max(1, Math.round(share * 100))));

  function debtPicture(r, baseLabel, baseWord) {
    const more = moreText(r.interestShare, r.totalInterestCents);
    return '<div>' +
      blocksHtml([[100, 'b'], [interestBlocks(r.interestShare, r.totalInterestCents), 'g']], { label: 'Blocks: 100 blue for the amount ' + baseWord + ', gold for the interest. ' + more + '.' }) +
      '<div class="legend"><span><i class="dot b"></i>' + baseLabel + ' ' + dollars(r.principalCents) + '</span>' +
      '<span><i class="dot g"></i>Interest ' + money(r.totalInterestCents) + '</span></div></div>';
  }

  const heroHtml = (label, value, sub, cls = '') =>
    '<div><div class="label">' + label + '</div><div class="hero ' + cls + '">' + value + '</div>' + (sub ? '<div class="sub">' + sub + '</div>' : '') + '</div>';

  const statHtml = (label, value, cls = '') => '<div class="stat"><span class="label">' + label + '</span><b class="' + cls + '">' + value + '</b></div>';

  // ---------- The calculators ----------
  const CALCS = {
    loan: {
      title: 'Loan',
      blurb: 'What a fixed-rate loan costs you, payment by payment.',
      icon: '<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9.5 15l5-6"/><circle cx="9.5" cy="9.5" r=".9"/><circle cx="14.5" cy="14.5" r=".9"/>',
      fields: [
        { id: 'amount', label: 'Amount', kind: 'money', value: '100,000' },
        { id: 'rate', label: 'Interest rate', kind: 'number', unit: '%', value: '8' },
        { id: 'years', label: 'Term', kind: 'int', unit: 'years', value: '5' },
        { id: 'io', label: 'Interest-only first', kind: 'int', unit: 'months', value: '12' },
      ],
      compute(v) {
        const principalCents = readMoney(v.amount, 'amount');
        if (principalCents === 0) throw new Problem('Enter the amount you want to borrow.');
        const rate = readRate(v.rate);
        const years = readInt(v.years, 'term', { min: 1, max: 50, unit: 'years' });
        const io = readInt(v.io, 'interest-only period', { min: 0, max: 600, optional: true, unit: 'months' }) || 0;
        if (io >= years * 12) throw new Problem('The interest-only months must be shorter than the term.');
        const r = E.calculateLoan({ principalCents, rate, termPeriods: years * 12, interestOnlyPeriods: io });
        const sub = r.interestOnlyPaymentCents == null ? '' : 'after ' + io + ' interest-only ' + (io === 1 ? 'month' : 'months') + ' at ' + money(r.interestOnlyPaymentCents);
        return {
          html: heroHtml('Monthly payment', money(r.paymentCents), sub) +
            debtPicture(r, 'Borrowed', 'borrowed') +
            heroHtml('You pay back', '<span class="gold">' + moreText(r.interestShare, r.totalInterestCents) + '</span>', 'than you borrowed. ' + money(r.totalPaidCents) + ' in total.'),
          breakdown: { schedule: r.schedule, baseLabel: 'Principal', baseTotal: r.principalCents, noun: 'Month' },
        };
      },
    },

    mortgage: {
      title: 'Mortgage',
      blurb: 'Your payment, what you still owe when the term ends, and the interest along the way.',
      icon: '<path d="M3.5 11L12 4l8.5 7"/><path d="M6 9.5V20h12V9.5"/>',
      fields: [
        { id: 'price', label: 'Home price', kind: 'money', value: '400,000' },
        { id: 'down', label: 'Down payment', kind: 'money', value: '100,000' },
        { id: 'rate', label: 'Interest rate', kind: 'number', unit: '%', value: '5' },
        { id: 'amort', label: 'Amortization', kind: 'int', unit: 'years', value: '25' },
        { id: 'term', label: 'Term', kind: 'int', unit: 'years', value: '5' },
        { id: 'freq', label: 'Payments', kind: 'select', value: 'monthly', options: Object.entries(E.Frequency).map(([k, f]) => [k, f.label]) },
        { id: 'comp', label: 'Interest compounds', kind: 'select', wide: true, value: '2', options: [['2', 'Twice a year (Canada, fixed rate)'], ['12', 'Monthly (US and most others)']] },
      ],
      compute(v) {
        const priceCents = readMoney(v.price, 'home price');
        if (priceCents === 0) throw new Problem('Enter the home price.');
        const downPaymentCents = readMoney(v.down, 'down payment', { optional: true });
        if (downPaymentCents >= priceCents) throw new Problem('The down payment must be less than the home price.');
        const rate = readRate(v.rate);
        const amortizationYears = readInt(v.amort, 'amortization', { min: 1, max: 40, unit: 'years' });
        const termYears = readInt(v.term, 'term', { min: 1, max: 40, optional: true, unit: 'years' });
        if (termYears != null && termYears > amortizationYears) throw new Problem('The term cannot be longer than the amortization.');
        const freq = E.Frequency[v.freq];
        const r = E.calculateMortgage({ priceCents, downPaymentCents, rate, amortizationYears, termYears, frequency: v.freq, compoundsPerYear: Number(v.comp) });
        const heroLabel = { monthly: 'Monthly payment', semiMonthly: 'Payment twice a month', biWeekly: 'Payment every 2 weeks', acceleratedBiWeekly: 'Payment every 2 weeks', weekly: 'Weekly payment', acceleratedWeekly: 'Weekly payment' }[v.freq];
        let termStats = '';
        if (termYears != null && r.balanceAtTermEndCents > 0) {
          termStats = '<div class="stats">' +
            statHtml('Still owing after ' + plural(termYears, 'year'), money(r.balanceAtTermEndCents)) +
            statHtml('Interest in those ' + plural(termYears, 'year'), money(r.interestOverTermCents), 'gold') + '</div>';
        }
        return {
          html: heroHtml(heroLabel, money(r.paymentCents), 'on a mortgage of ' + dollars(r.principalCents) + ', paid off in ' + duration(r.payoffPeriods, freq.perYear)) +
            termStats +
            debtPicture(r, 'Borrowed', 'borrowed') +
            heroHtml('You pay back', '<span class="gold">' + moreText(r.interestShare, r.totalInterestCents) + '</span>', 'than you borrowed, if the rate never changes. ' + money(r.totalPaidCents) + ' in total.'),
          breakdown: { schedule: r.schedule, baseLabel: 'Principal', baseTotal: r.principalCents, noun: freq.perYear === 12 ? 'Month' : 'Payment' },
        };
      },
    },

    savings: {
      title: 'Savings',
      blurb: 'How regular deposits grow, and how much of the total is interest.',
      icon: '<rect x="5" y="15.5" width="14" height="4.5" rx="2"/><rect x="5" y="9.75" width="14" height="4.5" rx="2"/><rect x="5" y="4" width="14" height="4.5" rx="2"/>',
      fields: [
        { id: 'start', label: 'Starting amount', kind: 'money', value: '5,000' },
        { id: 'deposit', label: 'Monthly deposit', kind: 'money', value: '200' },
        { id: 'rate', label: 'Interest rate', kind: 'number', unit: '%', value: '4.5' },
        { id: 'years', label: 'For', kind: 'int', unit: 'years', value: '20' },
      ],
      compute(v) {
        const initialCents = readMoney(v.start, 'starting amount', { optional: true });
        const contributionCents = readMoney(v.deposit, 'monthly deposit', { optional: true });
        if (initialCents === 0 && contributionCents === 0) throw new Problem('Enter a starting amount or a monthly deposit.');
        const rate = readRate(v.rate);
        const years = readInt(v.years, 'number of years', { min: 1, max: 60, unit: 'years' });
        const r = E.calculateSavings({ initialCents, contributionCents, rate, years });
        const byYear = r.schedule.byYear();
        const top = r.finalBalanceCents || 1;
        let deposited = initialCents;
        const cols = byYear.map((y) => {
          deposited += y.paymentCents;
          const interestPct = (y.cumulativeInterestCents / top) * 100;
          const depositPct = (deposited / top) * 100;
          return '<div class="col" title="Year ' + y.period + ': ' + money(y.closingCents) + '">' +
            (y.cumulativeInterestCents > 0 ? '<i class="g" style="height:' + interestPct.toFixed(2) + '%"></i>' : '') +
            '<i class="b" style="height:' + depositPct.toFixed(2) + '%"></i></div>';
        }).join('');
        return {
          html: heroHtml('After ' + plural(years, 'year'), money(r.finalBalanceCents), '') +
            '<div><div class="chart" role="img" aria-label="Balance at the end of each year. Deposits in blue, interest in gold.">' + cols + '</div>' +
            '<div class="axis"><span>Year 1</span><span>Year ' + years + '</span></div></div>' +
            '<div class="stats">' + statHtml('<i class="dot b"></i> You put in', money(r.totalContributedCents), 'blue') +
            statHtml('<i class="dot g"></i> Interest earned', money(r.totalInterestCents), 'gold') + '</div>',
          breakdown: { schedule: r.schedule, baseLabel: 'Deposits', baseTotalLabel: 'Monthly deposits', baseTotal: r.schedule.totalPaidCents, noun: 'Month', savings: true },
        };
      },
    },

    payoff: {
      title: 'Debt payoff',
      blurb: 'How long a fixed payment takes to clear a balance, and what paying extra saves.',
      icon: '<path d="M4 6h5v5h5v5h6"/><path d="M4 20h16"/>',
      fields: [
        { id: 'balance', label: 'Balance', kind: 'money', value: '5,000' },
        { id: 'rate', label: 'Interest rate', kind: 'number', unit: '%', value: '19.99' },
        { id: 'payment', label: 'Monthly payment', kind: 'money', value: '150' },
        { id: 'extra', label: 'Extra each month', kind: 'money', value: '50' },
        { id: 'comp', label: 'Interest compounds', kind: 'select', wide: true, value: '365', options: [['365', 'Daily (credit cards)'], ['12', 'Monthly (most loans)']] },
      ],
      compute(v) {
        const balanceCents = readMoney(v.balance, 'balance');
        if (balanceCents === 0) throw new Problem('Enter the balance you owe.');
        const rate = readRate(v.rate);
        const paymentCents = readMoney(v.payment, 'monthly payment');
        if (paymentCents === 0) throw new Problem('Enter the monthly payment.');
        const extraPaymentCents = readMoney(v.extra, 'extra payment', { optional: true });
        const input = { balanceCents, rate, paymentCents, compoundsPerYear: Number(v.comp) };
        let r;
        try {
          r = E.calculateDebtPayoff({ ...input, extraPaymentCents });
        } catch (e) {
          if (!(e instanceof E.PaymentTooSmallError)) throw e;
          throw new Problem('A payment of ' + money(e.paymentCents) + ' never clears this debt, because one month of interest is ' + money(e.interestCents) + '. Pay at least ' + money(e.minimumPaymentCents) + ' a month.');
        }
        let saving = '';
        if (extraPaymentCents > 0) {
          try {
            const base = E.calculateDebtPayoff(input);
            const months = base.periods - r.periods;
            saving = '<p class="note">The extra ' + money(extraPaymentCents) + ' a month saves <span class="gold">' + money(base.totalInterestCents - r.totalInterestCents) + '</span> of interest and clears the debt ' + (months > 0 ? duration(months, 12) + ' sooner' : 'in the same number of months') + '.</p>';
          } catch (e) {
            if (!(e instanceof E.PaymentTooSmallError)) throw e;
            saving = '<p class="note">Without the extra ' + money(extraPaymentCents) + ', the ' + money(paymentCents) + ' payment would not cover the interest and the debt would never be cleared.</p>';
          }
        }
        return {
          html: heroHtml('Paid off in', duration(r.periods, 12), 'paying ' + money(paymentCents + extraPaymentCents) + ' a month', 'small') +
            saving +
            debtPicture(r, 'Balance', 'owed') +
            heroHtml('You pay back', '<span class="gold">' + moreText(r.interestShare, r.totalInterestCents) + '</span>', 'than you owe today. ' + money(r.totalPaidCents) + ' in total.'),
          breakdown: { schedule: r.schedule, baseLabel: 'Principal', baseTotal: r.principalCents, noun: 'Month' },
        };
      },
    },

    compare: {
      title: 'Compare rates',
      blurb: 'The same loan at two interest rates, side by side.',
      icon: '<rect x="5" y="10" width="5" height="10" rx="1"/><rect x="14" y="4" width="5" height="16" rx="1"/>',
      fields: [
        { id: 'amount', label: 'Amount', kind: 'money', value: '100,000' },
        { id: 'years', label: 'Term', kind: 'int', unit: 'years', value: '5' },
        { id: 'rateA', label: 'Rate A', kind: 'number', unit: '%', value: '6' },
        { id: 'rateB', label: 'Rate B', kind: 'number', unit: '%', value: '8' },
      ],
      compute(v) {
        const principalCents = readMoney(v.amount, 'amount');
        if (principalCents === 0) throw new Problem('Enter the amount you want to borrow.');
        const years = readInt(v.years, 'term', { min: 1, max: 50, unit: 'years' });
        const rateA = readRate(v.rateA, 'rate A');
        const rateB = readRate(v.rateB, 'rate B');
        const run = (rate) => E.calculateLoan({ principalCents, rate, termPeriods: years * 12 });
        const a = run(rateA);
        const b = run(rateB);
        const rows = Math.max(1, Math.ceil(Math.max(interestBlocks(a.interestShare, a.totalInterestCents), interestBlocks(b.interestShare, b.totalInterestCents)) / 10));
        const side = (r, text) =>
          '<div class="side"><div class="rate">' + esc(text.trim().replace('%', '')) + '%</div>' +
          '<div class="stack" style="--rows:' + rows + '">' + blocksHtml([[interestBlocks(r.interestShare, r.totalInterestCents), 'g']], { cols: 10, chunky: true, label: 'Interest is ' + Math.round(r.interestShare * 100) + '% of the amount borrowed.' }) + '</div>' +
          statHtml('Interest', money(r.totalInterestCents), 'gold') +
          statHtml('Monthly payment', money(r.paymentCents)) +
          statHtml('Total repaid', money(r.totalPaidCents)) + '</div>';
        const gap = Math.abs(b.totalInterestCents - a.totalInterestCents);
        const payGap = Math.abs(b.paymentCents - a.paymentCents);
        const verdict = gap === 0
          ? heroHtml('The two rates cost', 'The same', '')
          : heroHtml('The higher rate costs you', '<span class="gold">' + money(gap) + '</span>', 'more interest over ' + plural(years, 'year') + ', and ' + money(payGap) + ' more every month.');
        return {
          html: '<div class="versus">' + side(a, v.rateA) + side(b, v.rateB) + '</div>' +
            '<p class="sub">Each block is interest worth 1% of the amount borrowed.</p>' + verdict,
          breakdown: null,
        };
      },
    },
  };

  // ---------- State ----------
  const STORE = 'oakridge-calculator-v1';
  const state = { active: 'loan', values: {}, byYear: true, openYear: null };
  for (const [id, calc] of Object.entries(CALCS)) {
    state.values[id] = Object.fromEntries(calc.fields.map((f) => [f.id, f.value]));
  }
  try {
    const saved = JSON.parse(localStorage.getItem(STORE) || 'null');
    if (saved && typeof saved === 'object') {
      if (CALCS[saved.active]) state.active = saved.active;
      if (typeof saved.byYear === 'boolean') state.byYear = saved.byYear;
      for (const [id, calc] of Object.entries(CALCS)) {
        for (const f of calc.fields) {
          const value = saved.values && saved.values[id] && saved.values[id][f.id];
          if (typeof value !== 'string') continue;
          if (f.kind === 'select' && !f.options.some(([key]) => key === value)) continue;
          state.values[id][f.id] = value.slice(0, 24);
        }
      }
    }
  } catch (e) { /* storage unavailable: start from the defaults */ }

  function save() {
    try { localStorage.setItem(STORE, JSON.stringify({ active: state.active, values: state.values, byYear: state.byYear })); } catch (e) { /* ignore */ }
  }

  // ---------- Number pad ----------
  // On touch screens the page shows its own number pad and asks the system
  // keyboard to stay closed (inputmode="none"). With a mouse or a physical
  // keyboard nothing changes.
  const coarse = window.matchMedia('(pointer: coarse)');
  const usePad = () => coarse.matches;
  const pad = $('pad');
  let padInput = null;

  function showPad(input) {
    padInput = input;
    pad.hidden = false;
    pad.querySelector('[data-key="."]').disabled = input.dataset.kind === 'int';
    const inputs = [...$('fields').querySelectorAll('input')];
    $('pad-next').textContent = inputs.indexOf(input) === inputs.length - 1 ? 'Done' : 'Next';
    document.documentElement.style.setProperty('--pad', pad.offsetHeight + 'px');
    input.scrollIntoView({ block: 'nearest' });
  }

  function hidePad() {
    padInput = null;
    pad.hidden = true;
    document.documentElement.style.removeProperty('--pad');
  }

  function padPress(key) {
    const input = padInput;
    if (!input) return;
    if (key === 'next' || key === 'done') {
      const inputs = [...$('fields').querySelectorAll('input')];
      const next = key === 'next' ? inputs[inputs.indexOf(input) + 1] : null;
      if (next) { next.focus(); next.select(); } else { input.blur(); hidePad(); }
      return;
    }
    const start = input.selectionStart == null ? input.value.length : input.selectionStart;
    const end = input.selectionEnd == null ? start : input.selectionEnd;
    if (key === 'del') {
      if (start === end && start === 0) return;
      input.setRangeText('', start === end ? start - 1 : start, end, 'end');
    } else {
      const rest = input.value.slice(0, start) + input.value.slice(end);
      if (key === '.' && (input.dataset.kind === 'int' || rest.includes('.'))) return;
      if (rest.length + key.length > 24) return;
      input.setRangeText(key, start, end, 'end');
    }
    input.dispatchEvent(new Event('input', { bubbles: true }));
  }

  // Keys never take focus from the field, so the caret stays where it is.
  let holdTimer = null;
  let holdRepeat = null;
  let heldDelete = false;
  const stopHold = () => { clearTimeout(holdTimer); clearInterval(holdRepeat); holdTimer = holdRepeat = null; };
  pad.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    const button = e.target.closest('button[data-key="del"]');
    if (!button) return;
    heldDelete = false;
    stopHold();
    holdTimer = setTimeout(() => {
      heldDelete = true;
      holdRepeat = setInterval(() => padPress('del'), 70);
    }, 450);
  });
  for (const type of ['pointerup', 'pointercancel', 'pointerleave']) pad.addEventListener(type, stopHold);
  pad.addEventListener('click', (e) => {
    const button = e.target.closest('button[data-key]');
    if (!button || button.disabled) return;
    if (button.dataset.key === 'del' && heldDelete) { heldDelete = false; return; }
    padPress(button.dataset.key);
  });

  const padShouldStay = () => {
    const active = document.activeElement;
    return pad.contains(active) || (active && active.matches && active.matches('#fields input'));
  };
  $('fields').addEventListener('focusin', (e) => {
    if (usePad() && e.target.matches('input')) showPad(e.target); else hidePad();
  });
  const maybeHide = () => setTimeout(() => { if (!padShouldStay()) hidePad(); }, 0);
  $('fields').addEventListener('focusout', maybeHide);
  pad.addEventListener('focusout', maybeHide);
  // A tap anywhere outside the fields and the pad puts the pad away.
  document.addEventListener('pointerdown', (e) => {
    if (padInput && !pad.contains(e.target) && !e.target.closest('.field')) padInput.blur();
  });
  coarse.addEventListener('change', () => { hidePad(); renderFields(); });

  // ---------- Rendering ----------
  function renderNav() {
    $('nav').innerHTML = Object.entries(CALCS).map(([id, calc]) =>
      '<button type="button" data-calc="' + id + '"' + (id === state.active ? ' aria-current="page"' : '') + '>' +
      '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + calc.icon + '</svg>' +
      esc(calc.title) + '</button>').join('');
    // On narrow screens the list scrolls sideways: keep the current one in view.
    const nav = $('nav');
    const current = nav.querySelector('[aria-current="page"]');
    if (current && nav.scrollWidth > nav.clientWidth) {
      nav.scrollLeft = current.offsetLeft - (nav.clientWidth - current.offsetWidth) / 2;
    }
  }

  function renderFields() {
    const calc = CALCS[state.active];
    const values = state.values[state.active];
    $('calc-title').textContent = calc.title;
    $('calc-blurb').textContent = calc.blurb;
    $('fields').innerHTML = calc.fields.map((f) => {
      const id = 'f-' + f.id;
      let control;
      if (f.kind === 'select') {
        control = '<select id="' + id + '" data-field="' + f.id + '">' + f.options.map(([key, text]) => '<option value="' + esc(key) + '"' + (values[f.id] === key ? ' selected' : '') + '>' + esc(text) + '</option>').join('') + '</select>';
      } else {
        control = '<span class="row">' + (f.kind === 'money' ? '<span class="unit">$</span>' : '') +
          '<input id="' + id + '" data-field="' + f.id + '" data-kind="' + f.kind + '" type="text" inputmode="' + (usePad() ? 'none' : f.kind === 'int' ? 'numeric' : 'decimal') + '" autocomplete="off" maxlength="24" value="' + esc(values[f.id]) + '">' +
          (f.unit ? '<span class="unit">' + f.unit + '</span>' : '') + '</span>';
      }
      return '<label class="field' + (f.wide ? ' wide' : '') + '" for="' + id + '"><span>' + esc(f.label) + '</span>' + control + '</label>';
    }).join('');
  }

  let breakdown = null;

  function renderResult({ intro = false } = {}) {
    const calc = CALCS[state.active];
    const result = $('result');
    let view;
    try {
      view = calc.compute(state.values[state.active]);
    } catch (e) {
      if (!(e instanceof Problem)) console.error(e);
      view = { html: '<p class="problem">' + esc(e instanceof Problem ? e.message : 'Those numbers do not work together. Check them and try again.') + '</p>', breakdown: null };
    }
    result.classList.toggle('intro', intro);
    result.innerHTML = view.html;
    breakdown = view.breakdown;
    $('main').classList.toggle('solo', !breakdown);
    renderBreakdown();
  }

  function rowsTable(bd, rows) {
    return '<table><thead><tr><th scope="col">' + bd.noun + '</th><th scope="col">Interest</th><th scope="col">' + (bd.savings ? 'Deposit' : 'Principal') + '</th><th scope="col">Balance</th></tr></thead><tbody>' +
      rows.map((r) => '<tr><td>' + r.period + '</td><td class="gold">' + money(r.interestCents) + '</td><td class="blue">' + money(r.principalCents) + '</td><td>' + money(r.closingCents) + '</td></tr>').join('') +
      '</tbody></table>';
  }

  function renderBreakdown() {
    const el = $('breakdown');
    const bd = breakdown;
    el.hidden = !bd;
    if (!bd) { el.innerHTML = ''; return; }
    const schedule = bd.schedule;
    let body;
    if (state.byYear) {
      const years = schedule.byYear();
      if (!years.some((y) => y.period === state.openYear)) state.openYear = null;
      const largest = Math.max(1, ...years.map((y) => y.interestCents + y.principalCents));
      body = '<ol class="years">' + years.map((y) => {
        const open = y.period === state.openYear;
        const width = Math.max(2, ((y.interestCents + y.principalCents) / largest) * 100);
        const interest = y.interestCents > 0 ? '<i class="g" style="flex:' + y.interestCents + ' 1 0"></i>' : '';
        const interestText = '<span class="gold">Interest ' + money(y.interestCents) + '</span>';
        const baseText = '<span class="blue">' + bd.baseLabel + ' ' + money(y.principalCents) + '</span>';
        const base = y.principalCents > 0 ? '<i class="b" style="flex:' + y.principalCents + ' 1 0"></i>' : '';
        return '<li class="yr"><button type="button" class="yr-btn" data-year="' + y.period + '" aria-expanded="' + open + '">' +
          '<span class="yr-top"><b>Year ' + y.period + '</b><span class="muted">Balance ' + money(y.closingCents) +
          '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 9l7 7 7-7"/></svg></span></span>' +
          '<span class="bar" style="width:' + width.toFixed(2) + '%">' +
          (bd.savings ? base + interest : interest + base) + '</span>' +
          '<span class="yr-nums">' + (bd.savings ? baseText + interestText : interestText + baseText) + '</span></button>' +
          (open ? '<div class="yr-rows">' + rowsTable(bd, schedule.rows.slice(y.firstRow, y.firstRow + y.rowCount)) + '</div>' : '') + '</li>';
      }).join('') + '</ol>';
    } else {
      body = '<div class="scroll" tabindex="0" role="region" aria-label="Every ' + bd.noun.toLowerCase() + '">' + rowsTable(bd, schedule.rows) + '</div>';
    }
    el.innerHTML = '<div class="bd-head"><h2 id="bd-title">Breakdown</h2>' +
      '<div class="seg"><button type="button" data-view="period" aria-pressed="' + !state.byYear + '">By ' + bd.noun.toLowerCase() + '</button>' +
      '<button type="button" data-view="year" aria-pressed="' + state.byYear + '">By year</button></div>' +
      '<div class="stats">' + statHtml('Interest', money(schedule.totalInterestCents), 'gold') + statHtml(bd.baseTotalLabel || bd.baseLabel, money(bd.baseTotal), 'blue') + '</div></div>' + body;
  }

  function open(id) {
    state.active = id;
    state.openYear = null;
    renderNav();
    renderFields();
    renderResult({ intro: true });
    save();
  }

  // ---------- Events ----------
  $('nav').addEventListener('click', (e) => {
    const button = e.target.closest('button[data-calc]');
    if (button && button.dataset.calc !== state.active) {
      open(button.dataset.calc);
      window.scrollTo(0, 0);
    }
  });

  const onField = (e) => {
    const field = e.target.dataset && e.target.dataset.field;
    if (!field) return;
    state.values[state.active][field] = e.target.value;
    renderResult();
    save();
  };
  $('fields').addEventListener('input', onField);
  $('fields').addEventListener('change', onField);

  // Tidy money fields when the user leaves them: 100000 becomes 100,000.
  $('fields').addEventListener('focusout', (e) => {
    if (!e.target.dataset || e.target.dataset.kind !== 'money') return;
    try {
      const cents = E.parseCents(e.target.value);
      const tidy = group(Math.floor(cents / 100)) + (cents % 100 ? '.' + String(cents % 100).padStart(2, '0') : '');
      if (tidy !== e.target.value) {
        e.target.value = tidy;
        state.values[state.active][e.target.dataset.field] = tidy;
        save();
      }
    } catch (err) { /* leave what was typed */ }
  });

  $('breakdown').addEventListener('click', (e) => {
    const view = e.target.closest('button[data-view]');
    if (view) {
      state.byYear = view.dataset.view === 'year';
      renderBreakdown();
      save();
      const again = $('breakdown').querySelector('button[data-view="' + view.dataset.view + '"]');
      if (again) again.focus();
      return;
    }
    const year = e.target.closest('button[data-year]');
    if (year) {
      const n = Number(year.dataset.year);
      state.openYear = state.openYear === n ? null : n;
      renderBreakdown();
      const again = $('breakdown').querySelector('button[data-year="' + n + '"]');
      if (again) again.focus();
    }
  });

  open(state.active);
})();
<\/script>
</body>
</html>

</script>

<script>
'use strict';

/* =======================================================================
   PRAXIS SITE — WHAT TO EDIT

   1. LINKS    Channel links. Leave a link empty and its button stays hidden.
   2. VIDEOS   The library. One entry per video. To publish one, set
               status: 'published', the date, and (when you have it) the url.
   3. PAGES    The site's pages. The order here is the order in the nav.

   ADDING A PAGE
   A page written for this site:
       { id: 'about', label: 'About', title: 'About', render: () => `<div class="wrap">…</div>` }
   A self-contained HTML piece (a tool, a simulator):
       paste it into a new text/plain block with id="embed-NAME"
       above, then add
       { id: 'NAME', label: 'Name', title: 'Name', embed: 'embed-NAME' }
   Either way the page gets a nav link, a footer link and the address #/id.
   Add  soon: true  to show a "Soon" tag beside the nav link.
   ======================================================================= */

const LINKS = {
  youtube: '',      // e.g. 'https://www.youtube.com/@yourchannel'
};

const VIDEOS = [
  {
    id: 's002',
    code: 'S002',
    title: 'Why can someone with a high income still be broke?',
    format: 'short',
    status: 'published',
    date: '2026-10-03',
    url: '',
    poster: { fig: '$0', line: 'left at month end', cols: 10, groups: [[['g', 20]], [['w', 20]]] },
    summary: 'You get a big promotion. You make more, so you spend more: the nicer car, the bigger place, the better restaurants. None of it looks like a problem on its own, because you can afford it. But if your spending rises every time your income does, you end up right back where you started.',
    takeaway: 'If you spend everything you make, it doesn’t matter how high your income is. You can still end the month with nothing left.',
  },
  {
    id: 's001',
    code: 'S001',
    title: 'Why is 8% interest high?',
    format: 'short',
    status: 'published',
    date: '2026-10-02',
    url: '',
    poster: { fig: '8%', line: 'became 25% more', cols: 10, groups: [[['b', 8]], [['g', 25]]] },
    summary: 'You borrow $100,000 at 8% to open your business. For the first year you only pay the interest, about $667 a month. A year in, you check your balance and you still owe $100,000. Then the real payments start: about $2,441 a month for four years, each one finally chipping away at the debt.',
    takeaway: '8% interest made you pay back 25% more than you borrowed.',
    numbers: [
      ['Borrowed', '$100,000'],
      ['Interest rate', '8% a year'],
      ['Year 1, interest only', 'about $667 a month'],
      ['Years 2 to 5', 'about $2,441 a month'],
      ['Interest paid', 'about $25,182'],
      ['Paid back in total', 'about $125,182'],
    ],
    tool: { page: 'calculator', label: 'Run your own loan' },
  },
  {
    id: 's003',
    code: 'S003',
    title: 'Why a lower mortgage payment can cost more in the long run',
    format: 'short',
    status: 'upcoming',
    stage: 'In production',
    date: '',
    url: '',
    poster: { fig: '30', line: 'years instead of 20', cols: 10, groups: [[['o', 30]]] },
    // Shown once status is 'published'.
    summary: 'Your broker recommends 30 years instead of 20. Borrowing $300,000 at 5%, that drops the payment from about $1,971 a month to $1,601, which frees up $370 every month. But you pay the debt down more slowly, and the bank collects interest for longer.',
    takeaway: 'Saving $370 a month cost about $103,000 more in interest.',
    numbers: [
      ['Borrowed', '$300,000'],
      ['Interest rate', '5%'],
      ['Payment over 20 years', 'about $1,971 a month'],
      ['Payment over 30 years', 'about $1,601 a month'],
      ['Monthly difference', 'about $370'],
      ['Extra interest over 30 years', 'about $103,000'],
    ],
    fine: 'Canadian dollars. 5% a year compounded twice a year, the same rate at every renewal, regular monthly payments, and no extra payments or fees.',
    source: { label: 'Financial Consumer Agency of Canada: mortgage relief options', url: 'https://www.canada.ca/en/financial-consumer-agency/services/mortgages/relief-options.html' },
    tool: { page: 'calculator', label: 'Run your own mortgage' },
  },
  {
    id: 'l001',
    code: 'L001',
    title: 'Why is everything so expensive?',
    format: 'long',
    status: 'upcoming',
    stage: 'In development',
    date: '',
    url: '',
    poster: { fig: '?', line: 'The first long-form video', cols: 12, groups: [[['o', 36]]] },
  },
];

const FORMATS = { short: 'Short', long: 'Long-form' };

/* What the calculator page contains (names and descriptions match the tool). */
const CALCULATORS = [
  ['Loan', 'What a fixed-rate loan costs you, payment by payment.'],
  ['Mortgage', 'Your payment, what you still owe when the term ends, and the interest along the way.'],
  ['Savings', 'How regular deposits grow, and how much of the total is interest.'],
  ['Debt payoff', 'How long a fixed payment takes to clear a balance, and what paying extra saves.'],
  ['Compare rates', 'The same loan at two interest rates, side by side.'],
];

const PAGES = [
  { id: 'home', title: '', render: renderHome },
  { id: 'library', label: 'Library', title: 'Library', render: renderLibrary },
  {
    id: 'calculator', label: 'Calculator', title: 'Calculator',
    embed: 'embed-calculator',
    // The site bar already carries the brand, so the tool's own wordmark is hidden.
    embedCss: '.brand{display:none!important}',
    standaloneUrl: 'https://calculator.oakridgepartners.ca',
  },
  { id: 'interactive', label: 'Interactive', title: 'Interactive', soon: true, render: renderInteractive },
];

/* =======================================================================
   Helpers
   ======================================================================= */
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const $ = (sel, root = document) => root.querySelector(sel);

/* The Praxis coin: a P with a straight stem and a rounded bowl inside two rings. */
const EMBLEM = '<svg viewBox="-1 -1 2 2" aria-hidden="true"><circle r="1" fill="#D4AF37"/><circle r=".865" fill="none" stroke="#000" stroke-opacity=".38" stroke-width=".035"/><circle r=".785" fill="none" stroke="#000" stroke-opacity=".28" stroke-width=".02"/><path fill="#000" fill-rule="evenodd" d="M-.48 .61H-.245V.165H.095A.375 .38 0 0 0 .095-.595H-.48ZM-.245-.378H.135V-.055H-.245Z"/></svg>';

function formatDate(iso) {
  const [y, m, d] = iso.split('-').map(Number);
  return new Date(y, m - 1, d).toLocaleDateString('en-CA', { year: 'numeric', month: 'long', day: 'numeric' });
}

function blocks(spec) {
  return spec.map(([kind, n]) => Array.from({ length: n }, () => `<i class="blk ${kind}"></i>`).join('')).join('');
}

function poster(v) {
  const p = v.poster;
  const cls = ['poster', v.format === 'long' ? 'wide' : '', v.status === 'upcoming' ? 'pending' : ''].join(' ').trim();
  return `<div class="${cls}" aria-hidden="true"><div class="poster-in">
    <div><div class="fig">${esc(p.fig)}</div><div class="line">${esc(p.line)}</div></div>
    <div class="blockset">${p.groups.map((g) => `<div class="blocks" style="--cols:${p.cols}">${blocks(g)}</div>`).join('')}</div>
  </div></div>`;
}

function card(v) {
  const live = v.status === 'published';
  const right = live ? formatDate(v.date) : v.stage;
  const inner = `${poster(v)}
    <div><h3>${esc(v.title)}</h3>
    <div class="meta"><span>${FORMATS[v.format]}</span><span>${esc(right)}</span></div></div>`;
  const cls = 'card' + (v.format === 'long' ? ' wide' : '');
  return live
    ? `<a class="${cls}" href="#/library/${v.id}">${inner}</a>`
    : `<div class="${cls}">${inner}</div>`;
}

const published = () => VIDEOS.filter((v) => v.status === 'published').sort((a, b) => b.date.localeCompare(a.date));
const upcoming = () => VIDEOS.filter((v) => v.status === 'upcoming');

/* =======================================================================
   Pages
   ======================================================================= */
function renderHome() {
  const out = published();
  const next = upcoming().filter((v) => v.format === 'short').slice(0, 1);
  const interest = Array.from({ length: 25 }, (_, i) => `<i class="blk g" style="--i:${i}"></i>`).join('');
  return `
  <div class="wrap">
    <section class="hero">
      <div>
        <h1>Start with<br>a question.</h1>
        <p class="lede">Follow where it leads. Praxis makes short, visual explanations of how money actually works, and free tools to run the numbers yourself.</p>
        <div class="actions">
          <a class="btn primary" href="#/library">Browse the library</a>
          <a class="btn" href="#/calculator">Open the calculator</a>
        </div>
      </div>
      <a class="stage" href="#/library/s001" aria-label="Why is 8% interest high? Borrow $100,000 at 8%, pay back about $125,182. Open the video page.">
        <p class="q">Why is 8% interest high?</p>
        <div class="stack" aria-hidden="true">
          <div class="interest">${interest}</div>
          <div class="borrowed">${blocks([['b', 100]])}</div>
        </div>
        <div class="legend" aria-hidden="true">
          <div><i class="dot b"></i>Borrowed<b>$100,000</b></div>
          <div><i class="dot g"></i>Interest<b>$25,182</b></div>
        </div>
        <p class="cap" aria-hidden="true">Interest only for a year, then paid off over four. Each block is $1,000.</p>
      </a>
    </section>

    <section class="section">
      <div class="section-head">
        <h2>Latest videos</h2>
        <a class="text-link" href="#/library">See all videos</a>
      </div>
      <div class="shelf">${[...out, ...next].map(card).join('')}</div>
    </section>

    <section class="section">
      <div class="split">
        <div>
          <h2>Then run your own numbers</h2>
          <p class="lede">The calculator shows where every payment goes: what pays down the amount you borrowed, and what goes to interest.</p>
          <div class="actions"><a class="btn primary" href="#/calculator">Open the calculator</a></div>
        </div>
        <ul class="calc-list">${CALCULATORS.map(([n, d]) => `<li><b>${esc(n)}</b><span>${esc(d)}</span></li>`).join('')}</ul>
      </div>
    </section>

    <section class="section">
      <div class="split">
        <div>
          <h2>Next: an interactive piece</h2>
          <p class="lede">Watching explains a system. Making the decisions yourself is how you get a feel for it. The first interactive piece is in development.</p>
          <div class="actions"><a class="btn" href="#/interactive">See what’s coming</a></div>
        </div>
      </div>
    </section>
  </div>`;
}

const libraryState = { filter: 'all' };

function renderLibrary(rest) {
  if (rest[0]) return renderVideo(rest[0]);
  const f = libraryState.filter;
  const match = (v) => f === 'all' || v.format === f;
  const out = published().filter(match);
  const next = upcoming().filter(match);
  const used = Object.keys(FORMATS).filter((k) => VIDEOS.some((v) => v.format === k));
  const chips = [['all', 'All'], ...used.map((k) => [k, k === 'short' ? 'Shorts' : FORMATS[k]])]
    .map(([k, label]) => `<button type="button" data-filter="${k}" aria-pressed="${k === f}">${label}</button>`).join('');
  return `
  <div class="wrap">
    <header class="page-head">
      <h1>Library</h1>
      <p class="lede">Every Praxis video, newest first. Each one starts with a single question.</p>
      ${used.length > 1 ? `<div class="filters" role="group" aria-label="Show">${chips}</div>` : ''}
    </header>
    <section class="group">
      <h2>Out now</h2>
      ${out.length ? `<div class="shelf">${out.map(card).join('')}</div>` : `<p class="empty">Nothing published in this format yet. The first one is listed under “Coming up”.</p>`}
    </section>
    ${next.length ? `<section class="group"><h2>Coming up</h2><div class="shelf">${next.map(card).join('')}</div></section>` : ''}
  </div>`;
}

function renderVideo(id) {
  const v = VIDEOS.find((x) => x.id === id && x.status === 'published');
  if (!v) return renderMissing();
  const watch = v.url ? `<a class="btn primary" href="${esc(v.url)}" target="_blank" rel="noopener">Watch the video</a>` : '';
  const tool = v.tool ? `<a class="btn${watch ? '' : ' primary'}" href="#/${v.tool.page}">${esc(v.tool.label)}</a>` : '';
  return `
  <div class="wrap">
    <a class="back" href="#/library"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>Library</a>
    <article class="video">
      ${poster(v)}
      <div>
        <h1>${esc(v.title)}</h1>
        <p class="when">${FORMATS[v.format]}, published ${formatDate(v.date)}</p>
        <p class="summary">${esc(v.summary)}</p>
        ${v.takeaway ? `<p class="takeaway">${esc(v.takeaway)}</p>` : ''}
        ${watch || tool ? `<div class="actions">${watch}${tool}</div>` : ''}
        ${v.numbers ? `<dl class="numbers">${v.numbers.map(([k, val]) => `<div><dt>${esc(k)}</dt><dd>${esc(val)}</dd></div>`).join('')}</dl>` : ''}
        ${v.fine ? `<p class="fine">${esc(v.fine)}</p>` : ''}
        ${v.source ? `<p class="fine">Source: <a href="${esc(v.source.url)}" target="_blank" rel="noopener">${esc(v.source.label)}</a></p>` : ''}
      </div>
    </article>
  </div>`;
}

function renderInteractive() {
  const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  return `
  <div class="wrap">
    <section class="soon">
      <div>
        <h1>One year, played out.</h1>
        <p class="lede">The first interactive Praxis piece is in development. You set up a simple financial life, then a year happens to it. Income arrives, bills leave, and not everything goes to plan.</p>
        <p class="lede">It isn’t ready yet. This page is where it will live.</p>
        <div class="actions">
          <a class="btn primary" href="#/calculator">Open the calculator</a>
          <a class="btn" href="#/library">Browse the library</a>
        </div>
      </div>
      <div class="year" aria-hidden="true">${months.map((m) => `<div><i class="blk o"></i>${m}</div>`).join('')}</div>
    </section>
  </div>`;
}

function renderMissing() {
  return `
  <div class="wrap">
    <header class="page-head">
      <h1>Page not found</h1>
      <p class="lede">There’s nothing at this address. It may have moved, or the link may be mistyped.</p>
      <div class="actions" style="margin-top:28px"><a class="btn primary" href="#/">Go to the home page</a><a class="btn" href="#/library">Browse the library</a></div>
    </header>
  </div>`;
}

/* =======================================================================
   Embedded pages
   ======================================================================= */
const embedHosts = {};

function mountEmbed(page) {
  let host = embedHosts[page.id];
  if (host) return host;
  host = document.createElement('div');
  host.className = 'embed';
  $('#embeds').appendChild(host);
  embedHosts[page.id] = host;

  const fail = () => {
    host.innerHTML = `<div class="fallback wrap">
      <h1>The ${esc(page.title.toLowerCase())} couldn’t load inside this page.</h1>
      <p class="lede">${page.standaloneUrl ? 'It still works on its own page.' : 'Reload the page to try again.'}</p>
      ${page.standaloneUrl ? `<a class="btn primary" href="${esc(page.standaloneUrl)}" target="_blank" rel="noopener">Open the ${esc(page.title.toLowerCase())}</a>` : ''}
    </div>`;
  };

  const source = document.getElementById(page.embed);
  if (!source) { fail(); return host; }
  const LT = '<';
  let doc = source.textContent.replace(/<\\\/script/gi, LT + '/script').replace(/<\\!--/g, LT + '!--');
  const ready = LT + 'script>addEventListener("load",function(){try{parent.postMessage({praxisEmbed:"' + page.id + '"},"*")}catch(e){}})' + LT + '/script>';
  doc = doc.replace('</head>', '<style>' + (page.embedCss || '') + '</style></head>').replace(LT + '/body>', ready + LT + '/body>');

  const frame = document.createElement('iframe');
  frame.title = page.title;
  host.appendChild(frame);
  host.dataset.ready = '';
  frame.srcdoc = doc;
  setTimeout(() => { if (host.dataset.ready !== 'yes') fail(); }, 5000);
  return host;
}

window.addEventListener('message', (e) => {
  const id = e.data && e.data.praxisEmbed;
  if (id && embedHosts[id]) embedHosts[id].dataset.ready = 'yes';
});

/* =======================================================================
   Router
   ======================================================================= */
const state = { path: '' };

function readHash() {
  try { return decodeURIComponent((location.hash || '').replace(/^#\/?/, '')).replace(/\/+$/, ''); } catch (e) { return ''; }
}

function navigate(path, push = true) {
  state.path = path;
  if (push) {
    try { history.pushState(null, '', '#/' + path); } catch (e) { /* address bar unavailable: the page still changes */ }
  }
  render(true);
}

function render(moved) {
  const [first = '', ...rest] = state.path.split('/');
  const id = first || 'home';
  const page = PAGES.find((p) => p.id === id) || { id: '', title: 'Page not found', render: renderMissing };
  const view = $('#view');
  const isEmbed = Boolean(page.embed);

  document.documentElement.classList.toggle('embed-mode', isEmbed);
  view.hidden = isEmbed;
  $('#foot').hidden = isEmbed;
  $('#embeds').hidden = !isEmbed;
  for (const host of Object.values(embedHosts)) host.hidden = true;

  if (isEmbed) mountEmbed(page).hidden = false;
  else view.innerHTML = page.render(rest);

  for (const a of document.querySelectorAll('#site-nav a')) {
    if (a.dataset.page === page.id) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
  }
  const video = id === 'library' && VIDEOS.find((v) => v.id === rest[0] && v.status === 'published');
  const title = video ? video.title : page.title;
  document.title = title ? title + ' | Praxis by Oakridge' : 'Praxis by Oakridge';
  if (moved) {
    window.scrollTo(0, 0);
    if (!isEmbed) view.focus({ preventScroll: true });
  }
}

document.addEventListener('click', (e) => {
  const filter = e.target.closest('[data-filter]');
  if (filter) { libraryState.filter = filter.dataset.filter; render(false); return; }
  const a = e.target.closest('a[href^="#/"]');
  if (!a || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || e.button !== 0) return;
  e.preventDefault();
  navigate(a.getAttribute('href').replace(/^#\/?/, '').replace(/\/+$/, ''));
});
const onAddressChange = () => { const p = readHash(); if (p !== state.path) navigate(p, false); };
window.addEventListener('popstate', onAddressChange);
window.addEventListener('hashchange', onAddressChange);

/* =======================================================================
   Start
   ======================================================================= */
for (const el of document.querySelectorAll('[data-brand]')) {
  el.innerHTML = EMBLEM + '<b>Praxis</b><span>by Oakridge</span>';
  el.setAttribute('aria-label', 'Praxis by Oakridge, home');
}
const navPages = PAGES.filter((p) => p.label);
$('#site-nav').innerHTML = navPages
  .map((p) => `<a href="#/${p.id}" data-page="${p.id}">${esc(p.label)}${p.soon ? '<span class="tag">Soon</span>' : ''}</a>`).join('');
$('#foot-nav').innerHTML = navPages.map((p) => `<a href="#/${p.id}">${esc(p.label)}</a>`).join('')
  + (LINKS.youtube ? `<a href="${esc(LINKS.youtube)}" target="_blank" rel="noopener">YouTube</a>` : '');

state.path = readHash();
render(false);
</script>
</body>
</html>
